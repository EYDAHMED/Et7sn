name: et7sn
description: Et7sn - bilingual (Arabic/English) fitness, nutrition and prayer-times app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # flutter_localizations pins the exact intl version it needs, so "any" is correct here.
  intl: any

  # Version ranges let `flutter pub get` pick the newest mutually compatible Firebase set.
  firebase_core: ">=3.6.0 <9.0.0"
  firebase_auth: ">=5.3.0 <9.0.0"
  cloud_firestore: ">=5.4.0 <9.0.0"

  provider: ^6.1.2
  shared_preferences: ^2.3.2
  geolocator: ">=13.0.0 <16.0.0"
  adhan: ^2.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <8.0.0"

flutter:
  uses-material-design: true

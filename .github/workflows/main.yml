name: Build Et7sn APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Finds the folder that contains pubspec.yaml, even if the project was
      # uploaded inside a sub-folder of the repository.
      - name: Locate project folder
        run: |
          PUBSPEC=$(find . -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found in the repository"; exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --org com.et7sn --project-name et7sn --platforms android .

      - name: Apply Et7sn Android settings
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 setup_android.py

      - name: Add Firebase config
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Secret GOOGLE_SERVICES_JSON_BASE64 is missing"; exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Get packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: et7sn-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
